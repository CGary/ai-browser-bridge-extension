schema_version: "1.0.0"
mission: "software-dev"
profile: "comprehensive"
answers:
  project_intent: >
    aibbe es un puente de automatización de UI de IA para ingenieros de software senior en mercados emergentes
    con restricción de costo $0. Orquesta flujos de trabajo síncronos desde una CLI local hacia interfaces web
    de asistentes de IA (NotebookLM, etc.) en Chromium, eliminando la necesidad de APIs comerciales de pago.
    Arquitectura de tres capas: CLI (Go, efímero) → Daemon (Go, residente, Unix socket) → Chrome Extension
    (MV3, Native Messaging). Modelo de recurso único (1 FTE, Kanban WIP=1). Uso estrictamente local y privado.
  languages_frameworks: >
    Go 1.21 (daemon, CLI), JavaScript (Chrome Extension Manifest V3 - background.js, content scripts).
    Testing: go test con tabla de casos (table-driven). Static analysis: go vet. Sin frameworks externos —
    stdlib Go puro para IPC y Native Messaging.
  testing_requirements: >
    Strict TDD obligatorio. Tests table-driven en todos los packages Go. Helpers clave: tempSocketPath()
    (t.TempDir()), startMockDaemon(), buildCLIBinary(), requireUnixSocketSupport(), ioReadAllWithDeadline()
    con deadline de 2 segundos. Runner: go test ./... Cobertura mínima: no definida numéricamente, pero
    todo comportamiento de borde y Fail-Fast debe tener test. Type checking: go vet.
  quality_gates: >
    Fail-Fast absoluto: cualquier error de protocolo, desincronización o size violation → os.Exit(1).
    Sin retries. Validación en dos capas (IPC 1MB + Native Messaging 1MB). Socket permissions 0600 vía
    umask 0o177. Conventional commits obligatorios. go vet sin errores antes de merge. Sin código muerto ni
    backwards-compatibility shims.
  review_policy: >
    Proyecto individual (1 FTE senior). Sin PRs formales ni proceso de revisión por pares. El propio
    desarrollador valida mediante tests antes de avanzar la tarea Kanban siguiente. WIP=1 estricto.
  performance_targets: >
    CLI debe completar en menos de 2 segundos para operaciones locales (IPC + respuesta del daemon).
    Native Messaging: máximo 1 MB por mensaje (límite Chromium). Timeout end-to-end del Content Script:
    150 segundos configurables (window.__AIBBE_TIMEOUT). Settle timer: 750ms antes de confirmar respuesta DOM.
  deployment_constraints: >
    Despliegue local en Debian 12. Compilación nativa Go. El Native Host Manifest debe instalarse manualmente
    en ~/.config/chromium/NativeMessagingHosts/aibbe.json. La extensión usa ID estático
    bedlojjaiogmaefoadfpdecgajipcpgj. Sin CI/CD automatizado. Sin containerización. Costo operativo: $0.
  documentation_policy: >
    Documentación mantenida en docs/ (PRD, Especificaciones Funcionales, SDD, UI-UX, Roadmap). Código sin
    comentarios por defecto — solo cuando el WHY no es obvio (invariante oculto, workaround específico).
    Sin docstrings multi-línea. Sin archivos de planificación en el repositorio.
  risk_boundaries: >
    DOM Fragility: los selectores CSS de terceros (Google, NotebookLM) pueden cambiar sin aviso →
    mantenimiento reactivo obligatorio. Límite 1MB Native Messaging: payload excesivo cierra el canal
    abruptamente. Socket residual: el archivo .sock debe eliminarse en init para evitar conflictos.
    Bloqueo de Gemini: se documentó que Gemini bloquea conexiones de Native Messaging activamente.
    Datos volátiles: CERO persistencia a disco o chrome.storage — todo en RAM durante la transacción.
  amendment_process: >
    El charter se actualiza cuando cambia la arquitectura de capas, se incorpora un nuevo proveedor de IA,
    o se modifica el contrato IPC. El desarrollador edita answers.yaml y regenera. Sin proceso de aprobación
    formal (proyecto individual).
  exception_policy: >
    Fail-Fast es la única política de excepción. Sin fallbacks, sin retries, sin manejo de casos imposibles.
    Los errores se propagan como JSON estructurado con prefijos tipificados hasta la CLI. Exit code 1 en
    cualquier error. La CLI termina, el usuario reinicia el flujo.

